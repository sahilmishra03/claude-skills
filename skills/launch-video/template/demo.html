<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>RunwayX demo</title>
<link rel="stylesheet" href="demo.css">
</head>
<body>
<div id="stage">
  <!-- 1. Kinetic intro -->
  <div id="intro" class="layer"></div>

  <!-- 2. MacBook scene, moved by the camera -->
  <div id="desk" class="layer">
    <img id="backdrop" src="assets/backdrop.jpg" alt="">
    <div id="cam">
      <div id="mac">
        <div id="lid">
          <div id="screen">
            <div id="wall"></div>
            <div id="menubar"></div>
            <div id="sim">
              <div id="sim-title"><b>iPhone 16 Pro</b><span>iOS 18.2</span><i></i></div>
              <div id="device">
                <div id="phone" class="light"></div>
              </div>
            </div>
            <div id="notch"></div>
          </div>
        </div>
        <div id="base"><div id="base-lip"></div></div>
      </div>
    </div>
  </div>

  <!-- 3. Captions, cursor and outro sit above the camera -->
  <div id="caption"><p id="cap-n"></p><h2 id="cap-h"></h2><p id="cap-s"></p></div>
  <div id="ripple"></div>
  <div id="cursor"><svg viewBox="0 0 28 28" width="28" height="28"><path d="M8.2 4.6v17.3l4.2-4.1 2.7 6.3 3.1-1.3-2.7-6.2h5.9z" fill="#000" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/></svg></div>
  <div id="outro" class="layer"></div>
</div>
<script src="demo.js"></script>
</body>
</html>
